name: Repograph Python Package Workflow
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10.8
      - name: Install dependencies
        run: pip3 install -r requirements.txt
      - name: Lint with black
        run: |
          black .
      - name: commit
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Python linting
  
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10.8
      - name: Clone test repos
        run: |
          cd ../demo && ./clone.sh
      - name: Install inspect4py
        # inspect4py hard-pins an old setuptools version in its own metadata, which
        # conflicts with the setuptools pin in requirements.txt, so it's installed
        # separately with --no-deps (see requirements.txt).
        run: pip3 install --no-deps "inspect4py==0.0.6"
      - name: Install dependencies
        run: pip3 install -r requirements.txt
      - name: Test with unittest
        run: |
          coverage run  --source=repograph -m unittest && coverage xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
